workflows:
  ios-workflow:
    name: iOS Workflow
    inputs:
      clientId:
        description: Client ID
        type: string
        default: dev
    labels:
      - ${CLIENT_ID}
    environment:
      xcode: 26
      vars:
        XCODE_SCHEME: swiftlabel
        CLIENT_ID: ${{ inputs.clientId }}
      groups:
        - aws_credentials
        - app_customization
    cache:
      cache_paths:
        - $HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
        - $HOME/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
    scripts:
      - name: check client id
        script: echo $CLIENT_ID
        
      - name: 🎨 Customize app
        script: make customize-app

      - name: 📝 Code signing
        script: make ios-code-sign

      - name: 🛠️ Build IPA
        script: make build-ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID


